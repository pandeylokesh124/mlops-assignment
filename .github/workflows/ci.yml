name: MLOps CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov flake8 black

      - name: Run Code Linting (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ test/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings (max line length = 120)
          flake8 src/ test/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Code Formatting Check (Black)
        run: |
          black --check src/ test/

      - name: Run Pytest Unit Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -v --cov=src --cov-report=term-missing
